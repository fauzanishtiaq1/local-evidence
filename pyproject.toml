[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-evidence"
version = "0.1.0"
description = "Offline, citation-preserving lexical search for local text files"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Fauzan Ishtiaq"}]
keywords = ["search", "evidence", "bm25", "offline", "citations"]
classifiers = ["Programming Language :: Python :: 3", "License :: OSI Approved :: MIT License"]
dependencies = []

[project.scripts]
local-evidence = "local_evidence.cli:main"

[tool.setuptools.packages.find]
include = ["local_evidence*"]
